spring.profiles.active=mock

# H2 in-memory in PostgreSQL compatibility mode keeps integration tests hermetic.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Disable Redis repositories (we provide a stubbed StringRedisTemplate via test config).
spring.data.redis.repositories.enabled=false

spring.mail.host=localhost
spring.mail.port=2525

virtualpet.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5zLXZpcnR1YWxwZXQtdGVzdA==
