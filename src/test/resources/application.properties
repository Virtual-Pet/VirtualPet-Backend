spring.profiles.active=mock

# H2 in-memory in PostgreSQL compatibility mode keeps integration tests hermetic.
# INIT pre-creates the schemas our @Table(schema=...) entities live in, before Hibernate
# generates the DDL (Hibernate's namespace auto-creation doesn't fire on this setup).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER;INIT=CREATE SCHEMA IF NOT EXISTS auth\\;CREATE SCHEMA IF NOT EXISTS catalog\\;CREATE SCHEMA IF NOT EXISTS orders\\;CREATE SCHEMA IF NOT EXISTS shipments
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the tables from the entity mappings (schemas pre-created via INIT above);
# the Postgres-only Flyway migrations don't run on H2, so tests stay hermetic.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
virtualpet.ratelimit.enabled=false

# Disable Redis repositories (we provide a stubbed StringRedisTemplate via test config).
spring.data.redis.repositories.enabled=false

virtualpet.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW5zLXZpcnR1YWxwZXQtdGVzdA==

# Stub Gemini key so the chatbot client bean can start; tests don't hit the real API.
app.gemini.api-key=test-gemini-key
