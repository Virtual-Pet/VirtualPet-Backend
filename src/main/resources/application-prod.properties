spring.application.name=virtual-pet-backend
server.port=${SERVER_PORT:8080}

# Graceful shutdown — finish in-flight requests before terminating.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Request size limits
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error responses follow RFC 7807 (problem+json).
spring.mvc.problemdetails.enabled=true
server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.git.mode=full

# JWT Config
virtualpet.jwt.secret=${JWT_SECRET}
virtualpet.jwt.expirationMs=86400000

# Database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway - Control de version BD
spring.flyway.enabled=true
spring.flyway.schemas=auth,catalog,orders,shipments
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis config
### start: quitar para usar redis despues
spring.data.redis.repositories.enabled=false
### end: quitar para usar redis despues
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail config
#spring.mail.host=localhost
#spring.mail.port=1025
management.health.mail.enabled=false
virtualpet.mail.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# OpenAPI / Swagger UI — sirve el spec hand-written copiado a static/ en build.
# El spec auto-generado de springdoc queda deshabilitado para evitar divergencia.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/virtualpet-openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini API (Google AI Studio) — integración directa sin Spring AI
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-3.1-flash-lite

# Logging — logback-spring.xml handles profile-specific config
logging.level.root=INFO
logging.level.com.virtualpet=DEBUG

# S3
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}

# CORS
virtualpet.cors.allowed-origins=${CORS_ORIGINS}
