spring.application.name=virtual-pet-backend
server.port=${SERVER_PORT:8080}

# JWT Config
virtualpet.jwt.secret=${JWT_SECRET}
virtualpet.jwt.expirationMs=86400000

# Database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway - Control de version BD
spring.flyway.enabled=true
spring.flyway.schemas=auth,catalog,orders,logistics
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis config
### start: quitar para usar redis despues
spring.data.redis.repositories.enabled=false
### end: quitar para usar redis despues
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail config
#spring.mail.host=localhost
#spring.mail.port=1025
management.health.mail.enabled=false
virtualpet.mail.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Logging — logback-spring.xml handles profile-specific config
logging.level.root=INFO
logging.level.com.virtualpet=DEBUG

# S3
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}

logging.level.root=WARN
logging.level.com.virtualpet=INFO
