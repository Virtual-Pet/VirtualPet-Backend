spring.application.name=virtual-pet-backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=dev

# JWT Config
virtualpet.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LXRva2Vucy12aXJ0dWFscGV0}
virtualpet.jwt.expirationMs=86400000

# Database config
spring.datasource.url=jdbc:postgresql://localhost:5432/virtualpetdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway - Control de version BD
spring.flyway.enabled=true
spring.flyway.schemas=auth,catalog,orders,logistics
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis config
### start: quitar para usar redis despues
spring.data.redis.repositories.enabled=false
### end: quitar para usar redis despues
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail config
spring.mail.host=localhost
spring.mail.port=1025

# Logging — logback-spring.xml handles profile-specific config
logging.level.root=INFO
logging.level.com.virtualpet=DEBUG
