spring.application.name=virtual-pet-backend
server.port=${SERVER_PORT}
spring.profiles.active=dev

# Graceful shutdown — finish in-flight requests before terminating.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Request size limits (tune per workload).
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error responses follow RFC 7807 (problem+json).
spring.mvc.problemdetails.enabled=true
server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

# Actuator — expose only what's needed; secure the rest behind auth.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.git.mode=full

# JWT Config
virtualpet.jwt.secret=${JWT_SECRET}
virtualpet.jwt.expirationMs=86400000

# CORS
virtualpet.cors.allowed-origins=${CORS_ORIGINS}

# Database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway - Control de version BD
spring.flyway.enabled=true
spring.flyway.schemas=auth,catalog,orders,shipments
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis config
### start: quitar para usar redis despues
spring.data.redis.repositories.enabled=false
### end: quitar para usar redis despues
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# OpenAPI / Swagger UI — sirve el spec hand-written copiado a static/ en build.
# El spec auto-generado de springdoc queda deshabilitado para evitar divergencia.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/virtualpet-openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# Logging — logback-spring.xml handles profile-specific config
logging.level.root=INFO
logging.level.com.virtualpet=DEBUG
