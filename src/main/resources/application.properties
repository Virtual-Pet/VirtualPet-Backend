spring.application.name=virtual-pet-backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=dev

# Graceful shutdown — finish in-flight requests before terminating.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Request size limits (tune per workload).
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error responses follow RFC 7807 (problem+json).
spring.mvc.problemdetails.enabled=true
server.error.include-message=on_param
server.error.include-binding-errors=on_param
server.error.include-stacktrace=never

# Actuator — expose only what's needed; secure the rest behind auth.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.git.mode=full

# JWT Config
virtualpet.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3Itand0LXRva2Vucy12aXJ0dWFscGV0}
virtualpet.jwt.expirationMs=86400000

# Database config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/virtualpetdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA - Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway - Control de version BD
spring.flyway.enabled=true
spring.flyway.schemas=auth,catalog,orders,shipments
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis config
### start: quitar para usar redis despues
spring.data.redis.repositories.enabled=false
### end: quitar para usar redis despues
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Logging — logback-spring.xml handles profile-specific config
logging.level.root=INFO
logging.level.com.virtualpet=DEBUG

# S3
#aws.s3.bucket=amzn-s3-virtualpet
#aws.region=us-east-2
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}

logging.level.root=WARN
logging.level.com.virtualpet=INFO
